<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تواصل معنا — خدمتك</title>
<style>
  :root{--bg:#0b1020;--card:#121a33;--fg:#eef2ff;--muted:#9aa6c7;--accent:#4f8cff;--accent2:#00d4a6;--border:#1f2a4d}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{width:100%;max-width:560px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px}
  h1{font-size:26px;margin-bottom:6px}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);margin-bottom:26px;font-size:15px}
  label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
  input,textarea{width:100%;background:#0e1530;border:1px solid var(--border);border-radius:10px;color:var(--fg);padding:13px 14px;font-size:15px;font-family:inherit;margin-bottom:16px}
  input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  textarea{min-height:130px;resize:vertical}
  button{width:100%;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:14px;font-size:17px;font-weight:700;cursor:pointer}
  button:hover{opacity:.92}
  #result{margin-top:16px;font-size:15px;text-align:center;min-height:22px}
  .ok{color:var(--accent2)} .err{color:#ff7a7a}
  .back{display:inline-block;margin-top:20px;color:var(--muted);font-size:14px;text-decoration:none}
</style>
</head>
<body>
  <div class="box">
    <h1>تواصل <span>معنا</span></h1>
    <p class="sub">ابعث لنا تفاصيل مشروعك — نرد خلال 24 ساعة.</p>
    <form id="contactForm" action="https://formsubmit.co/ajax/pilottestwork@gmail.com" method="POST">
      <label>الاسم</label>
      <input type="text" name="name" placeholder="اسمك الكامل" required>
      <label>البريد الإلكتروني</label>
      <input type="email" name="email" placeholder="example@email.com" required>
      <label>رقم الهاتف (اختياري)</label>
      <input type="text" name="phone" placeholder="+218 ...">
      <label>رسالتك</label>
      <textarea name="message" placeholder="شنو تحتاج؟ صف لنا مشروعك..." required></textarea>
      <input type="hidden" name="_subject" value="طلب جديد من الموقع">
      <input type="hidden" name="_captcha" value="false">
      <button type="submit">أرسل الطلب</button>
    </form>
    <div id="result"></div>
    <a class="back" href="index.html">← العودة للوحة</a>
  </div>
  <script>
    const form = document.getElementById('contactForm');
    const result = document.getElementById('result');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      result.textContent = 'جاري الإرسال...';
      result.className = '';
      try {
        const res = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });
        const data = await res.json();
        if (data.success) {
          result.textContent = '✅ تم الإرسال بنجاح! سنتواصل معك قريباً.';
          result.className = 'ok';
          form.reset();
        } else {
          result.textContent = '❌ حدث خطأ، حاول مرة أخرى.';
          result.className = 'err';
        }
      } catch (err) {
        result.textContent = '❌ مشكلة في الاتصال، حاول مرة أخرى.';
        result.className = 'err';
      }
    });
  </script>
</body>
</html>
