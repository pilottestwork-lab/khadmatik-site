<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فاتورة</title>
<style>
  body{font-family:"Segoe UI",Tahoma,Arial,sans-serif; background:#f4f6fb; color:#1a2240; margin:0; padding:40px}
  .inv{max-width:800px; margin:0 auto; background:#fff; border:1px solid #e2e8f5; border-radius:14px; padding:40px; box-shadow:0 4px 24px rgba(0,0,0,.06)}
  .head{display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #1a2240; padding-bottom:20px; margin-bottom:26px}
  .head h1{font-size:26px; margin:0}
  .head .meta{text-align:left; font-size:14px; color:#5a6a8c}
  table{width:100%; border-collapse:collapse; margin:20px 0}
  th,td{border:1px solid #e2e8f5; padding:12px; text-align:right; font-size:14px}
  th{background:#f0f4fc}
  .total{display:flex; justify-content:flex-end; margin-top:16px; font-size:18px; font-weight:800}
  .note{margin-top:26px; font-size:13px; color:#5a6a8c}
  @media print{body{background:#fff; padding:0} .inv{box-shadow:none; border:none}}
</style>
</head>
<body>
<div class="inv">
  <div class="head">
    <h1>فاتورة</h1>
    <div class="meta">
      رقم الفاتورة: [رقم]<br>
      التاريخ: [تاريخ]<br>
      العميل: [اسم العميل]
    </div>
  </div>

  <table>
    <thead>
      <tr><th>البند</th><th>الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th></tr>
    </thead>
    <tbody>
      <tr><td>[الخدمة]</td><td>1</td><td>[السعر]</td><td>[الإجمالي]</td></tr>
      <tr><td>[الخدمة]</td><td>1</td><td>[السعر]</td><td>[الإجمالي]</td></tr>
    </tbody>
  </table>

  <div class="total">الإجمالي: [المبلغ]</div>

  <div class="note">
    طريقة الدفع: [بيانات الدفع]<br>
    شكراً لتعاملكم معنا.
  </div>
</div>
</body>
</html>
